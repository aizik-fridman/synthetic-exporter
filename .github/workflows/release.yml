name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Build Linux amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w" -o synthetic-exporter-linux-amd64 ./main.go

      - name: Build Linux arm64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-s -w" -o synthetic-exporter-linux-arm64 ./main.go

      - name: Build Darwin amd64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w" -o synthetic-exporter-darwin-amd64 ./main.go

      - name: Build Darwin arm64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -trimpath -ldflags="-s -w" -o synthetic-exporter-darwin-arm64 ./main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            synthetic-exporter-linux-amd64
            synthetic-exporter-linux-arm64
            synthetic-exporter-darwin-amd64
            synthetic-exporter-darwin-arm64
